name: Data seed (macOS)

# Produces the official writable-Data seed that the Linux host cannot make: scripts/prepare-owner-data-fixture.py
# formats an APFS container with hdiutil and reads it back with diskutil, both macOS-only. Everything here is the
# upstream command sequence (docs/guide/userdata.md, docs/guide/skip-setup.md, .github/workflows/macos.yml); the
# only deviation from upstream policy is that the finished seed is uploaded as an artifact, so a Linux porter can
# flash it. Upstream uploads text logs only ("they derive from Apple software"): the fixture really does copy the
# original private/var regular files out of the Apple OS volume, so THIS REPOSITORY MUST BE PRIVATE. As of
# 2026-10-28 it is still public (a fine-grained PAT cannot change visibility: PATCH /repos returns 403 "Resource
# not accessible by personal access token"), which has to be fixed in the web UI. Artifact retention is 1 day.

on:
  workflow_dispatch:
    inputs:
      unixnu_repository:
        description: UniXNU repository as owner/name
        required: true
        default: UniXNU/UniXNU
      unixnu_ref:
        description: UniXNU ref to build the seed with
        required: true
        default: main
      seed_url:
        description: >-
          Download the base seed from this URL instead of formatting a new fixture or restoring a previous run's
          artifact. For a seed that already carries the audio and MediaCapture plug-ins this costs no IPSW fetch and
          no grow, so a plug-in round is minutes instead of an hour. The volume UUID inside the file is preserved by
          staging, so the kernel's CONFIG_XNU_OWNER_DATA_VOLUME_UUID pin still matches and no kernel rebuild follows.
        type: string
        default: ''
      base_seed:
        description: >-
          Run ID whose data-32.dbr to grow instead of formatting a fresh fixture. scripts/seed-data-grow.py
          preserves the volume UUID (docs/guide/userdata.md: "The volume UUID is preserved, but changing the seed
          size changes its persistence identity"), and the kernel looks the seed up by that UUID
          (kern_exec.c:7993 native_ram_block_volume_seed(XNU_OWNER_DATA_VOLUME_UUID, ...)), so growing a recorded
          seed needs no kernel rebuild while a fresh fixture always does. Empty = format a new one.
        type: string
        default: ''
      qemu_seed:
        description: >-
          Also grow the 32 MiB seed to the QEMU size given below (recipe: qemu-xvt/scripts/build-os-root.py:96-131,
          step 8 of the official QEMU fixture builder, which uses 1 GiB). Two ceilings bound that size. Only a seed
          of up to 2 GiB is writable under QEMU: drivers/NativeRamBlock.cpp:210 marks anything above 0x80000000 big
          and :261 then answers writes with kIOReturnNotReady until attachStore() finds a UFS store, which QEMU has
          none of -- while scripts/seed-data-grow.py:92 refuses to build anything below 3 GiB. And the sparse path
          hashes the seed's whole logical size once at attach (NativeRamBlock.cpp:235, 4 KiB per SHA256_Update),
          which measured 20+ minutes of TCG for 1 GiB on this host and seconds for 32 MiB: the big path above 2 GiB
          skips that hash by folding only its nonzero extents, which is why the device boots an 8 GiB seed happily
          and QEMU does not. Resizing preserves the volume UUID, so with base_seed set this seed ships as a
          payload-only change; from a fresh fixture it carries that fixture's new UUID like every other seed this
          run produces.
        type: boolean
        default: false
      qemu_seed_mib:
        description: >-
          MiB to grow the QEMU seed to (qemu_seed). 1024 is what the official fixture uses; 128 costs an eighth of
          its attach-time hash while still leaving ~24500 free blocks, against the 223 that made the 32 MiB seed
          report ENOSPC every transaction.
        type: string
        default: '1024'
      grow:
        description: Grow the seed to the size given below (scripts/seed-data-grow.py --gib)
        type: boolean
        default: true
      skip_setup:
        description: Mark Setup as done in the seed (scripts/seed-data-skip-setup.py)
        type: boolean
        default: true
      skip_setup_target:
        description: >-
          Which seed in this run's scratch directory Setup is marked done in, by file name (default: data-grow.dbr,
          else data-32.dbr). Set it to data-qemu.dbr to ship a Setup-done QEMU seed: docs/guide/skip-setup.md:34 wants
          the container grown first, and the 1 GiB seed is the form QEMU's NativeRamBlock can both write to and fit
          in memory. Left empty, this run's device seed is unaffected.
        type: string
        default: ''
      no_auto_dim:
        description: Also disable auto-dim and idle sleep in the seed (the tablet has no input driver yet)
        type: boolean
        default: true
      sheng_repository:
        description: >-
          Donor-board repository that carries the audio server plug-in, as owner/name. hal/ShengAudioPlugIn.c is the
          CoreAudio HAL the audio server loads, package/ShengAudioAbi.h is the shared-ring ABI the kernel service
          speaks, and scripts/build-sheng-audio-hal.py builds the bundle. The public head of this repository was
          checked against package/ShengAudioAbi.h on 2026-11-07 and is byte-identical to the ABI this board's kernel
          half uses (sha256 9ef369877cfae3d2255129f7fdf332448b71300a0fc840d6522ec83e09754b52), so the plug-in and the
          service cannot disagree about the control page; its only extra over our older snapshot is arm64e pointer
          authentication for iPadOS 27's server, which an arm64-apple-ios17.0 build compiles out.
        required: true
        default: UniXNU/UniXNU-sheng
      sheng_commit:
        description: >-
          Commit of the plug-in source. Pinned, not a branch: the CDHash that goes into the owner trust cache is a
          property of the exact bytes that were compiled, so a moving branch silently changes the signature and the
          next payload rejects a plug-in that still looks like the same file.
        required: true
        default: 689400177f93219a38bd7cf5ae2e9f5782adc594
      audio_hal:
        description: >-
          Build the CoreAudio server plug-in and upload the bundle with its CDHash. Without a HAL in
          /System/Library/Audio/Plug-Ins/HAL the audio server has no IOAudio2 device and the volume slider has
          nothing to talk to; the bundle gets there through the payload addon, which the kernel union-mounts over
          that directory (boot arg sheng-gpu-addon=1, kern_exec.c:7646 native_gpu_addon_prepare(), the 0xa00 entry),
          and its CDHash has to enter the owner trust cache because the signature is ad hoc.
        type: boolean
        default: true
      audio_only:
        description: >-
          Build only the plug-in: format no fixture, fetch no IPSW member, attach no Apple volume, grow and edit no
          seed. This is the input this delivery uses, because the official text says the audio update travels in the
          addon and does not edit the Data seed (docs/porting/packaging.md:136-137, docs/zh/devices/sheng.md:519), and
          the board's existing seed keeps working: the addon mount writes under /private/var/ngpu/audio at boot and
          leaves the volume UUID alone, so the kernel's CONFIG_XNU_OWNER_DATA_VOLUME_UUID pin still holds and nothing
          costs a kernel rebuild. A run with this input set produces no Apple-derived bytes at all.
        type: boolean
        default: false
      grow_gib:
        description: >-
          GiB to grow the seed to (scripts/seed-data-grow.py --gib N; docs/guide/userdata.md:63 uses 8). It is a
          porting decision recorded with the image, not a device read-out: the size has to fit the target Data
          allocation after root windows, store metadata and log reservations.
        required: true
        default: '8'
      board_repository:
        description: >-
          Repository that carries the board scripts for the MediaCapture plug-in, as owner/name. The audio plug-in is
          compiled from the donor tree because its source lives there; the MediaCapture bundle is compiled from this
          board's own repository, where package/DbyTorch/ios and package/DbyCamera/ios are. It is checked out under
          `board`, beside the `device` directory that already holds this repository's recorded board.toml, so turning
          the camera on cannot change what any audio step reads.
        required: true
        default: WQSQW/UniXNU-dby_w09
      board_commit:
        description: >-
          Commit of that repository, pinned for the same reason as sheng_commit: the CDHash that enters the owner trust
          cache is a property of the exact bytes that were compiled, and this plug-in is the whole payload of a run.
        required: true
        default: 8465f4926a3f95b90089c3ba66b3606029871910
      camera_plugin:
        description: >-
          Build /System/Library/MediaCapture/H6ISP.mediacapture and stage it into the seed at
          /private/var/ngpu/mediacapture. The kernel's fifth addon mount (window 0xe00,
          patches/xnu/zze-dby-torch-media-mount.patch, gated by dby-torch=1 dby-ti=1) presents that directory over
          /System/Library/MediaCapture, which is the path BWFigCaptureDeviceVendor dlopens for a service of class
          AppleH6CamIn; without that file dby_torch_ios_commit() refuses to publish at all, which is what the
          2026-11-09 boot read as `[torch] ios not made: the plug-in is not on the root`. Staging chains onto
          data-audio.dbr whenever audio_hal built one, so one seed carries both plug-ins.
        type: boolean
        default: false
      camera_test_pattern:
        description: >-
          Also stage the zero-length marker ngpu/mediacapture/DbyCameraTestPattern, the file DbyCameraProvider.m
          checks before it registers the CMIOExtension provider that emits the scrolling test image. A marker and not
          a boot argument, because the armed command line measures 998 of the 1000 bytes the payload gate allows. With
          this off the plug-in still carries the flashlight and the vendor-class fix and no camera device appears.
        type: boolean
        default: true
      gpu_plugin:
        description: >-
          Build the owner Adreno Metal plug-in and stage it into the seed at /private/var/ngpu/addons, which the
          kernel's first addon mount (window 0x400, sheng-gpu-addon=1) presents as a read-only union over
          /System/Library/Extensions -- the path the original Metal discovery reads MetalPluginName from. Without the
          plug-in in the seed the device composites the whole UI on the CPU.
        type: boolean
        default: false
      gpu_publish:
        description: >-
          Write /private/var/ngpu/addons/NativeAdrenoMetal.publish. docs/drivers/native-adreno.md states the
          consequence exactly: with the marker the plug-in returns the native Metal device to the original discovery
          in backboardd and CARenderServer composites through it; without it the plug-in only runs its own tests. It
          also writes CAEnableDeepFramebuffer, CAEnableFramebufferCompression and CAEnableIOSurfaceCompression = false
          for mobile and root, because the render server picks a 10-bit deep framebuffer unless told not to and reads
          that preference before any plug-in code can run.
        type: boolean
        default: true
      gpu_clients:
        description: >-
          Processes besides backboardd that get their own native Metal device, comma separated (empty = none,
          "*" = every process). A listed process also gets a 256 MiB GPU window and its own shader cache; any other
          process keeps the software renderer.
        type: string
        default: ''

permissions:
  contents: read
  # Needed only to download this repository's own previous seed when base_seed names a run.
  actions: read

concurrency:
  group: data-seed-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  seed:
    # Same image the official macOS build workflow pins; macos-latest moves between images.
    runs-on: macos-26
    timeout-minutes: 240
    env:
      UNIXNU_DEVICE: ${{ github.workspace }}/device

    steps:
      - name: Check out UniXNU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.unixnu_repository }}
          ref: ${{ inputs.unixnu_ref }}
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: device
          persist-credentials: false

      - name: Check out the plug-in source
        if: inputs.audio_hal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.sheng_repository }}
          ref: ${{ inputs.sheng_commit }}
          path: kit
          persist-credentials: false

      - name: Check out the board scripts
        if: inputs.camera_plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.board_repository }}
          ref: ${{ inputs.board_commit }}
          path: board
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the inputs
        run: |
          [ -f device/board.toml ] || { echo "::error::device/board.toml not found"; exit 1; }
          [ -f device/userdata-root.json ] || echo "::warning::device/userdata-root.json missing: grow cannot size the seed from the partition"
          if [ '${{ inputs.audio_hal }}' = true ]; then
            stat -f '%z %N' kit/hal/ShengAudioPlugIn.c kit/hal/Info.plist kit/package/ShengAudioAbi.h \
              kit/scripts/build-sheng-audio-hal.py
            plutil -p kit/hal/Info.plist
            # The gate, not a printout. The plug-in is compiled from the donor tree and records its own CDHash, so
            # bundle and trust entry cannot come apart; what is not automatic is the ABI. The board kernel compiles
            # package/ShengAudioService.cpp against the device repository's copy of ShengAudioAbi.h, and the
            # plug-in is compiled against this copy, so the control page and the two sample rings are the same
            # struct only while the two files are the same bytes. 9ef36987... is the device repository's digest.
            shasum -a 256 kit/hal/ShengAudioPlugIn.c kit/hal/Info.plist kit/package/ShengAudioAbi.h
            abi=$(shasum -a 256 kit/package/ShengAudioAbi.h | cut -d' ' -f1)
            if [ "$abi" != 9ef369877cfae3d2255129f7fdf332448b71300a0fc840d6522ec83e09754b52 ]; then
              echo "::error::kit/package/ShengAudioAbi.h is $abi, not the 9ef369877cfae3d2255129f7fdf332448b71300a0fc840d6522ec83e09754b52 the board kernel uses: the plug-in would read the shared rings at the wrong offsets"
              exit 1
            fi
          fi
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          board = tomllib.loads(Path('device/board.toml').read_text())
          ipsw = board['ipsw']
          pin = board['ipsw']['sha256']['044-76040-038.dmg']
          print(f"ipsw product={ipsw['product']} build={ipsw['build']} version={ipsw['version']}")
          print(f"OS member pin={pin}")
          PY
          git --version
          df -h "$GITHUB_WORKSPACE"

      - name: Restore the seed recorded by a previous run
        if: inputs.base_seed != '' && !inputs.audio_only
        run: |
          # The base seed is fetched from our own previous artifact rather than committed: it contains the original
          # private/var files copied out of the Apple OS volume, so it must not enter the repository tree.
          echo "growing the data-32.dbr published by run ${{ inputs.base_seed }}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.base_seed != '' && !inputs.audio_only
        with:
          name: unixnu-dby-w09-data-seed-${{ inputs.base_seed }}-1
          run-id: ${{ inputs.base_seed }}
          path: base-seed
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select the base seed
        if: inputs.base_seed != '' && !inputs.audio_only
        run: |
          # drivers/DarwinBoot/Test/packed_ramdisk.py is used by the grow and skip-setup steps; it is a submodule
          # and the "Pack the seed" step that normally initialises it is skipped in this mode.
          git submodule update --init --depth 1 drivers/DarwinBoot
          # Any recorded packed seed is a valid base: growth preserves the volume UUID (docs/guide/userdata.md), so
          # a 32 MiB fixture, a QEMU-sized seed and a Setup-done seed are all growable. Run #11 of 2026-10-29 named a
          # base whose artifact held only data-qemu.dbr/data-final.dbr, which this step then rejected by name.
          # The order is pre-Setup first, because grow refuses a seed that already holds the target size:
          # run #18 of 2026-11-08 named run #17 as its base, took the data-final.dbr of that run (already 8 GiB),
          # and died at "seed already holds 8 GiB; growing needs a larger size".
          base=
          for name in data-32.dbr data-qemu.dbr data-final.dbr; do
            base=$(find base-seed -name "$name" -print -quit)
            [ -n "$base" ] && break
          done
          [ -n "$base" ] || { echo "::error::no data-32.dbr/data-qemu.dbr/data-final.dbr in the artifact of run ${{ inputs.base_seed }}"; exit 1; }
          echo "growing $base"
          # docs/guide/skip-setup.md:34 wants the container grown before Setup is marked, so a base that is already
          # Setup-done (data-final.dbr) ships as skip_setup=false; a pre-Setup base still gets the documented order.
          cp "$base" "$RUNNER_TEMP/data-32.dbr"
          stat -f '%z %N' "$RUNNER_TEMP/data-32.dbr"
          shasum -a 256 "$RUNNER_TEMP/data-32.dbr"
          # The DBRDISK1 header itself records the logical size and content hash, so the base is checked rather
          # than trusted: growing a corrupt seed would only be visible as a mount failure on the board.
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'drivers/DarwinBoot/Test')
          import packed_ramdisk
          # inspect() returns (metadata, the first page); only the metadata is printed.
          print('base seed', packed_ramdisk.inspect(Path(os.environ['RUNNER_TEMP']) / 'data-32.dbr')[0])
          PY
          json=$(find base-seed -name seed.json -print -quit)
          # A run that only grew seeds records no fixture seed.json (run #12 died here: under bash -e a trailing
          # [ -n "$json" ] && ... is a failing final command). Growth leaves the volume UUID alone
          # (docs/guide/userdata.md), so the kernel's CONFIG_XNU_OWNER_DATA_VOLUME_UUID pin still holds.
          if [ -n "$json" ]; then
            echo 'the volume UUID this run keeps:'
            grep volume_uuid "$json"
          else
            echo 'no seed.json in the base artifact: this run inherits the base seed UUID'
          fi

      - name: Download the base seed
        if: inputs.seed_url != '' && !inputs.audio_only
        run: |
          set -euo pipefail
          # A seed that already carries the audio and MediaCapture plug-ins: staging adds the GPU addon directory
          # beside them and leaves the volume UUID alone, so nothing here reads the IPSW, formats a fixture or grows
          # the container. The URL is masked because it carries a token.
          seed_url=$(jq -r '.inputs.seed_url // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$seed_url"
          curl -fsSL --retry 3 "$seed_url" -o "$RUNNER_TEMP/data-final.dbr"
          stat -f '%z %N' "$RUNNER_TEMP/data-final.dbr"
          shasum -a 256 "$RUNNER_TEMP/data-final.dbr"
          # The DBRDISK1 header records the logical size and content hash, so the base is checked, not trusted:
          # staging a corrupt seed would only show up as a mount failure on the board.
          git submodule update --init --depth 1 drivers/DarwinBoot
          PYTHONPATH=drivers/DarwinBoot/Test python3 -c "import sys,packed_ramdisk;print(packed_ramdisk.inspect(sys.argv[1]))" "$RUNNER_TEMP/data-final.dbr"

      - name: Fetch the OS volume from the target IPSW
        if: inputs.base_seed == '' && inputs.seed_url == '' && !inputs.audio_only
        run: |
          # Range-reads the member, never the whole IPSW, and enforces the [ipsw.sha256] pin of the board.
          ./unixnu ipsw -D "$UNIXNU_DEVICE" fetch OS
          ls -l out/ipsw/*/

      - name: Attach the OS volume read-only
        if: inputs.base_seed == '' && inputs.seed_url == '' && !inputs.audio_only
        run: |
          dmg=$(ls "$PWD"/out/ipsw/*/044-76040-038.dmg)
          mkdir -p .cache/firmware/target-volumes/os-mount
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/.cache/firmware/target-volumes/os-mount" "$dmg"
          # The same assertions scripts/build-owner-os-policy.py:23-38 makes about this attachment.
          python3 - <<'PY'
          import hashlib, plistlib, subprocess, sys
          from pathlib import Path
          volume = Path('.cache/firmware/target-volumes/os-mount')
          info = plistlib.loads(subprocess.check_output(['diskutil', 'info', '-plist', str(volume)]))
          expected = '04769D26-2CA0-4825-B443-E2E5F88300F2'
          print('VolumeUUID', info['VolumeUUID'], 'Writable', info['Writable'], 'Content', info.get('Content'))
          if info['VolumeUUID'].upper() != expected:
              sys.exit(f"the attached volume is {info['VolumeUUID']}, not the original OS volume {expected}")
          if info['Writable'] is not False:
              sys.exit('the OS volume must be attached read-only')
          launchd = volume / 'sbin/launchd'
          # The gate scripts/prepare-owner-data-fixture.py:22 applies itself; checking it here names the cause.
          digest = hashlib.sha256(launchd.read_bytes()).hexdigest()
          pin = '8cec9a3c44a443b08e977ccc5d577850316ad428c575dc01f09b018dbd5b6a25'
          print('sbin/launchd', launchd.stat().st_size, 'bytes', digest)
          if digest != pin:
              sys.exit(f'sbin/launchd is {digest}, not the unchanged original {pin}')
          PY

      - name: Create the Data seed
        if: inputs.base_seed == '' && inputs.seed_url == '' && !inputs.audio_only
        run: |
          # Refuses unless .cache/firmware/target-volumes/os-mount/sbin/launchd is the unchanged original.
          python3 scripts/prepare-owner-data-fixture.py --output build/owner-data-fixture
          cat build/owner-data-fixture/seed.json

      - name: Pack the seed into DBRDISK1
        if: inputs.base_seed == '' && inputs.seed_url == '' && !inputs.audio_only
        run: |
          # seed-data-grow.py and seed-data-skip-setup.py both take a packed base; the fixture output is dense raw APFS.
          git submodule update --init --depth 1 drivers/DarwinBoot
          mkdir -p build
          python3 drivers/DarwinBoot/Test/packed_ramdisk.py \
            build/owner-data-fixture/owner-data-32.cdr "$RUNNER_TEMP/data-32.dbr"

      - name: Grow the QEMU seed
        if: inputs.qemu_seed && !inputs.audio_only
        run: |
          case '${{ inputs.qemu_seed_mib }}' in ''|*[!0-9]*) echo "qemu_seed_mib must be a whole number of MiB"; exit 1;; esac
          # The recipe is qemu-xvt/scripts/build-os-root.py:96-131 (step 8 of the official QEMU fixture builder), kept
          # line for line: sparse 1 GiB raw with the 32 MiB seed at offset 0, hdiutil attach as CRawDiskImage,
          # diskutil apfs resizeContainer <container> 0 so the container fills the image, the APFS header assertions,
          # SpringBoard's three no-auto-dim keys written for uid 501 through a second attachment with -owners on, then
          # packed for DarwinBoot. It is inlined because this token can update existing files but not create new ones
          # (POST /contents/<new path> -> 404, PUT of an existing path -> 200), and build-os-root.py itself only runs
          # as the whole macOS fixture build: it wants --ipsw and performs the verified-root, policy and driver builds
          # before this block. UniXNU's own grower cannot make a seed this small -- scripts/seed-data-grow.py:92
          # rejects anything below 3 GiB -- while a seed above 2 GiB is unwritable here:
          # drivers/NativeRamBlock.cpp:210 calls it big and :261 answers writes with kIOReturnNotReady until
          # attachStore() finds a UFS store, which QEMU has no way to provide. Step 8's own text gives both halves of
          # that rule: "32 MiB fills up within two minutes of the userland (backboardd then crashes with ENOSPC)" and
          # "NativeRamBlock keeps a seed of up to 2 GiB in memory and allocates a page on its first write; a larger one
          # waits for sheng's UFS store before it accepts writes".
          #
          # Two mechanical adaptations. The base is the packed data-32.dbr instead of the fixture's owner-data-32.cdr,
          # expanded with packed_ramdisk.regions() -- the inverse of the pack() that made it, the same pair
          # scripts/seed-data-skip-setup.py uses -- so the step works after a fresh fixture and on a seed restored from
          # a previous run, and only the container size changes: docs/guide/userdata.md records that a grown seed
          # keeps its volume UUID. And if the official PhysicalStores comparison finds no container, every container
          # and store is printed and the widened match (the container reference equals the attached node, or the
          # whole-disk prefix of its physical store does) is used; run #3 of 2026-10-28 showed that a hdiutil image
          # publishes two device nodes, so the comparison as written in scripts/seed-data-grow.py:107-115 can never
          # match an image.
          [ -f drivers/DarwinBoot/Test/packed_ramdisk.py ] || { echo '::error::drivers/DarwinBoot not initialised'; exit 1; }
          cat > "$RUNNER_TEMP/grow-qemu.py" <<'PY'
          import argparse
          import os
          import plistlib
          import re
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, 'drivers/DarwinBoot/Test')
          import packed_ramdisk

          GIB = 1 << 30
          TOLERANCE = 64 << 20

          parser = argparse.ArgumentParser()
          parser.add_argument('--base', type=Path, required=True)
          parser.add_argument('--output', type=Path, required=True)
          parser.add_argument('--mib', type=int, required=True)
          parser.add_argument('--work', type=Path)
          args = parser.parse_args()
          target = args.mib << 20
          work = args.work or Path(os.environ['RUNNER_TEMP']) / 'grow-qemu'
          work.mkdir(parents=True, exist_ok=True)


          def check(*command):
              result = subprocess.run([str(part) for part in command], capture_output=True, text=True)
              if result.returncode:
                  sys.exit(f'{command} failed {result.returncode} out={result.stdout} err={result.stderr}')
              return result.stdout


          def attach(image, *extra):
              return plistlib.loads(subprocess.check_output(
                  ['hdiutil', 'attach', '-imagekey', 'diskimage-class=CRawDiskImage', *extra, '-plist', str(image)]))


          logical, extents = packed_ramdisk.regions(args.base.read_bytes())
          if logical > target:
              sys.exit(f'{args.base} holds a {logical} byte container; growing it to {args.mib} MiB would shrink it')
          fixture = work / 'owner-data-32.cdr'
          with fixture.open('wb') as handle:
              handle.truncate(logical)
              for offset, data in extents:
                  handle.seek(offset)
                  handle.write(data)
          print(f'expanded {args.base} to {fixture} ({logical} bytes, {len(extents)} extents)', flush=True)

          raw = work / 'owner-data-qemu.raw'
          with raw.open('wb') as handle:                 # sparse: only the 32 MiB seed is written
              handle.truncate(target)
              handle.seek(0)
              handle.write(fixture.read_bytes())
          try:
              attached = attach(raw, '-nomount', '-nobrowse')
              store = Path(attached['system-entities'][0]['dev-entry']).name
              try:
                  listing = plistlib.loads(subprocess.check_output(['diskutil', 'apfs', 'list', '-plist']))
                  for entry in listing['Containers']:
                      for physical in entry.get('PhysicalStores', []):
                          print('grow-qemu: container', entry['ContainerReference'], 'store',
                                physical['DeviceIdentifier'], 'size', physical.get('Size'), flush=True)
                  try:
                      container = next(entry['ContainerReference'] for entry in listing['Containers']
                                       if any(s['DeviceIdentifier'] == store
                                              for s in entry.get('PhysicalStores', [])))
                  except StopIteration:
                      container = next(entry['ContainerReference'] for entry in listing['Containers']
                                       if any(entry['ContainerReference'] == store
                                              or re.match(r'disk\d+', s['DeviceIdentifier']).group(0) == store
                                              for s in entry.get('PhysicalStores', [])))
                  print(f'grow-qemu: attached {store}, resizing container {container}', flush=True)
                  print('grow-qemu: resized', check('diskutil', 'apfs', 'resizeContainer', container, '0'), flush=True)
              finally:
                  subprocess.run(['hdiutil', 'detach', store, '-force'], check=True)

              header = raw.open('rb').read(4096)
              blocks = int.from_bytes(header[40:48], 'little')
              if header[32:36] != b'NXSB' or not target - TOLERANCE <= blocks * 4096 <= target:
                  raise SystemExit(f'The grown Data seed is not a {args.mib} MiB APFS container')
              print(f'grow-qemu: {blocks} blocks of 4096 = {blocks * 4096} bytes', flush=True)

              # The seed's files belong to uid 501, which is mobile on iPadOS, the user SpringBoard and its
              # cfprefsd run as. Without these keys the display sleeps half a minute after the welcome screen and
              # ArmCpu cannot service the sleep on a board with no input driver.
              mount = work / 'mount'
              mount.mkdir(parents=True, exist_ok=True)
              attached = attach(raw, '-nobrowse', '-owners', 'on', '-mountpoint', mount)
              try:
                  preferences = mount / 'mobile/Library/Preferences/com.apple.springboard.plist'
                  values = plistlib.loads(preferences.read_bytes()) if preferences.exists() else {}
                  values.update(SBDisableAutoDim=True, SBDontDimOrLockOnAC=True, SBDisableIdleSleep=True)
                  preferences.write_bytes(plistlib.dumps(values, fmt=plistlib.FMT_BINARY))
                  preferences.chmod(0o600)
                  if preferences.stat().st_uid != 501:
                      raise SystemExit(f'{preferences} does not belong to uid 501 (mobile)')
              finally:
                  subprocess.run(['hdiutil', 'detach', attached['system-entities'][0]['dev-entry']], check=True)

              print(check('python3', 'drivers/DarwinBoot/Test/packed_ramdisk.py', raw, args.output), flush=True)
              print(f'grew {args.base} into {args.output}', flush=True)
          finally:
              raw.unlink(missing_ok=True)
          PY
          python3 "$RUNNER_TEMP/grow-qemu.py" --base "$RUNNER_TEMP/data-32.dbr" --mib '${{ inputs.qemu_seed_mib }}' \
            --output "$RUNNER_TEMP/data-qemu.dbr"
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'drivers/DarwinBoot/Test')
          import packed_ramdisk
          # inspect() returns (metadata, the first page); only the metadata is printed.
          print('QEMU seed', packed_ramdisk.inspect(Path(os.environ['RUNNER_TEMP']) / 'data-qemu.dbr')[0])
          PY

      - name: Grow the seed to the recorded size
        if: inputs.grow && !inputs.audio_only
        run: |
          case '${{ inputs.grow_gib }}' in ''|*[!0-9]*) echo "grow_gib must be a whole number of GiB"; exit 1;; esac
          # docs/guide/userdata.md:60-75 is the official sizing instruction: `--gib N` (its own example is 8) and
          # "choose a size that fits the target Data allocation after root windows, store metadata and log
          # reservations", then "record the selected size and root report with the image". --auto is documented as the
          # extra mode that queries a tablet in fastboot for userdata capacity; that number belongs to whichever board
          # happens to be attached, so this workflow does not use it and nothing device-specific is committed.
          mkdir -p build/userdata-root
          cp device/userdata-root.json build/userdata-root/userdata-root.json
          python3 - <<'PY'
          import sys
          from pathlib import Path
          path = Path('scripts/seed-data-grow.py')
          src = path.read_text()
          # scripts/seed-data-grow.py:107 captures the whole-disk node hdiutil reports (diskN) and :112 requires a
          # PhysicalStores[].DeviceIdentifier exactly equal to it. Run #3 (2026-10-28) printed what a hdiutil disk
          # image actually publishes: the seed is attached as /dev/disk10 with /dev/disk10s1 typed 41504653 ("APFS"),
          # and diskutil apfs list reports it as container disk10 whose physical store is disk9 — a disk image has two
          # device nodes, the UDIF one hdiutil names and the backing one the APFS stack uses. Neither "disk10s1" nor
          # "disk9" equals "disk10", so the official comparison can never succeed on an image and every grow stopped
          # at ":115 No APFS container found on the attached seed". Matching the container whose ContainerReference is
          # the attached node (or whose physical store lives on it) is the only change to the official sequence:
          # hdiutil attach, diskutil apfs resizeContainer <container> 0 and the repack all stay. The runner's own
          # system containers (disk0s1/disk0s2/disk3/disk5/disk7s1) match neither, so the seed is still the only hit.
          # The other edits only name the devices a run saw and stop swallowing diskutil's stderr, which is what made
          # the failure undiagnosable. Each anchor must appear exactly once.
          edits = [
            ("def run(*args):\n    return subprocess.run(args, check=True, capture_output=True, text=True).stdout\n",
             "def run(*args):\n    result = subprocess.run(args, capture_output=True, text=True)\n    if result.returncode:\n        sys.exit(str(args) + ' failed ' + str(result.returncode) + ' out=' + result.stdout + ' err=' + result.stderr)\n    return result.stdout\n"),
            (".split('/')[-1]\n",
             ".split('/')[-1]\n        print('grow: attached', attached.strip(), 'store', store, flush=True)\n"),
            ("                if any(s['DeviceIdentifier'] == store for s in entry.get('PhysicalStores', [])):\n                    container = entry['ContainerReference']\n",
             "                for physical in entry.get('PhysicalStores', []):\n                    print('grow: container', entry['ContainerReference'], 'store', physical['DeviceIdentifier'], 'size', physical.get('Size'), flush=True)\n                    if entry['ContainerReference'] == store or re.match(r'disk\\d+', physical['DeviceIdentifier']).group(0) == store:\n                        container = entry['ContainerReference']\n"),
            ("                sys.exit('No APFS container found on the attached seed')",
             "                sys.exit('No APFS container found on the attached seed ' + store + ' (see the grow: lines above)')"),
            ("            run('diskutil', 'apfs', 'resizeContainer', container, '0')",
             "            print('grow: resized', run('diskutil', 'apfs', 'resizeContainer', container, '0'), flush=True)"),
          ]
          for old, new in edits:
              if src.count(old) != 1:
                  sys.exit('anchor appears ' + str(src.count(old)) + ' times: ' + old.strip()[:70])
              src = src.replace(old, new)
          path.write_text(src)
          PY
          git --no-pager diff --stat scripts/seed-data-grow.py
          python3 scripts/seed-data-grow.py --gib '${{ inputs.grow_gib }}' \
            "$RUNNER_TEMP/data-32.dbr" "$RUNNER_TEMP/data-grow.dbr"

      - name: Mark Setup as done
        if: inputs.skip_setup && !inputs.audio_only
        env:
          NO_AUTO_DIM: ${{ inputs.no_auto_dim }}
        run: |
          want='${{ inputs.skip_setup_target }}'
          if [ -n "$want" ]; then
            base="$RUNNER_TEMP/$want"
            [ -f "$base" ] || { echo "::error::$want is not in \$RUNNER_TEMP: this run did not produce it"; exit 1; }
          else
            base="$RUNNER_TEMP/data-grow.dbr"
            [ -f "$base" ] || base="$RUNNER_TEMP/data-32.dbr"
          fi
          echo "Setup is marked done in $base"
          # Run #8 (2026-10-29) died here with FileNotFoundError: .../dby-w09-data-seed/build/data-seed-qoy5nw8y.
          # scripts/seed-data-skip-setup.py:49 makes its scratch dir with tempfile.TemporaryDirectory(dir=ROOT/'build'),
          # and in base_seed mode no earlier step (fetch/attach/fixture/pack) ever creates build/. The directory is
          # the script's own declared scratch parent, so creating it is the whole fix.
          mkdir -p build
          # Run #4 (2026-10-28) died here with exit 137 after 21 minutes: scripts/seed-data-skip-setup.py:89 checks
          # the APFS magic with raw.read_bytes()[32:36], which materialises the *whole* expanded image, so a grown
          # seed bigger than the runner's RAM is killed while the container is already mounted and edited. Reading
          # the same 4 bytes at offset 32 is the identical assertion; every other step (expand, hdiutil attach,
          # merge_pref, detach, packed_ramdisk.pack) is untouched.
          python3 - <<'PY'
          import sys
          from pathlib import Path
          path = Path('scripts/seed-data-skip-setup.py')
          src = path.read_text()
          old = "        if raw.read_bytes()[32:36] != b'NXSB':"
          new = ("        with raw.open('rb') as probe:\n"
                 "            probe.seek(32)\n"
                 "            magic = probe.read(4)\n"
                 "        if magic != b'NXSB':")
          if src.count(old) != 1:
              sys.exit('anchor appears ' + str(src.count(old)) + ' times: ' + old)
          path.write_text(src.replace(old, new))
          PY
          git --no-pager diff --stat scripts/seed-data-skip-setup.py
          args=()
          if [ "$NO_AUTO_DIM" = true ]; then args+=(--no-auto-dim); fi
          python3 scripts/seed-data-skip-setup.py "$base" "$RUNNER_TEMP/data-final.dbr" "${args[@]}"
          cat "$RUNNER_TEMP/data-final.json"

      - name: Build the audio server plug-in
        if: inputs.audio_hal
        run: |
          # The iPhoneOS SDK is the target; the CoreAudio headers come from the macOS SDK because the iOS one ships no
          # AudioServerPlugIn.h, and the builder symlinks the three it needs into a scratch include directory. The
          # default target is arm64-apple-ios17.0, which is this donor's audio server; the builder also accepts
          # arm64e-apple-ios27.0, and that variant changes the CDHash, so a target change is a trust-cache change.
          # codesign --pagesize 4096 is what iOS arm64 expects, and the ad hoc signature is why the CDHash has to be
          # added to the owner trust cache instead of the payload being self-sufficient.
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk macosx --show-sdk-path
          python3 kit/scripts/build-sheng-audio-hal.py "$RUNNER_TEMP/sheng-audio-hal"
          codesign --display --verbose=4 "$RUNNER_TEMP/sheng-audio-hal/ShengAudio.driver"
          cat "$RUNNER_TEMP/sheng-audio-hal/trust.json"
          # The two files the addon carries, and nothing else: mount4 checks ShengAudio.driver/Info.plist by its own
          # path (kern_exec.c:7646), so the bundle layout the builder writes is already the layout the kernel expects.
          stat -f '%z %N' "$RUNNER_TEMP/sheng-audio-hal/ShengAudio.driver/Info.plist" \
            "$RUNNER_TEMP/sheng-audio-hal/ShengAudio.driver/ShengAudio" "$RUNNER_TEMP/sheng-audio-hal/trust.json"

      - name: Stage the audio server plug-in into the seed
        if: inputs.audio_hal
        run: |
          set -euo pipefail
          # The carrier has to be the Data seed. The other official carrier, the addon blob
          # (scripts/make-gpu-addon.py, Payloads/kernel.macho.gpuaddon), needs a loader that publishes it to the
          # kernel, and the loader flashed on this board does not, so native_gpu_addon_install() returns early and
          # only the union mounts run. Those read their source from the Data volume, so the plug-in has to live at
          # /private/var/ngpu/audio/ShengAudio.driver inside the seed (window 0xa00 of
          # patches/xnu/zzyd-sheng-audio-addon-mount.patch, point /System/Library/Audio/Plug-Ins/HAL, gate
          # sheng-gpu-addon=1). What runs below is core's own scripts/add-gpu-plugin-data.py sequence
          # (packed_ramdisk.regions -> sparse raw -> hdiutil attach CRawDiskImage -> copy the bundle in -> NXSB
          # check -> packed_ramdisk.pack) with the audio bundle, audio paths and audio mount of this board. It is
          # inlined because the Contents API of this token cannot create a file at a new path (404 at any depth,
          # measured 2026-10-29), which is also how the QEMU recipe entered this workflow. BASE is not modified and
          # the volume UUID is unchanged, so over data-final.dbr this seed costs no kernel rebuild.
          # The inlined script resolves ROOT = parents[1] of its own path, so written to
          # $RUNNER_TEMP/stage/ it reads BUNDLE and its scratch dir under $RUNNER_TEMP/build, not
          # $RUNNER_TEMP/stage/build. Run #16 of 2026-11-08 died with "Build the plug-in first" (the bundle was in
          # stage/build, which the script never looks at), and run #17 of the same day died one line earlier,
          # at the heredoc, because that fix dropped the only command that created $RUNNER_TEMP/stage: both
          # directories are made now.
          mkdir -p "$RUNNER_TEMP/stage" "$RUNNER_TEMP/build"
          cp -R "$RUNNER_TEMP/sheng-audio-hal" "$RUNNER_TEMP/build/sheng-audio-hal"
          cat >"$RUNNER_TEMP/stage/add-sheng-audio-data.py" <<'PY'
          #!/usr/bin/env python3
          """Stage the owner-built audio server plug-in into a copy of a packed Data seed.

            add-sheng-audio-data.py BASE.dbr OUTPUT.dbr

          Adds /private/var/ngpu/audio/ShengAudio.driver (from build/sheng-audio-hal, see scripts/build-sheng-audio-hal.py). The kernel's
          boot-time addon mount (sheng-gpu-addon=1, patches/xnu/series-audio) presents that directory as a read-only union view over
          /System/Library/Audio/Plug-Ins/HAL, where the audio server loads every driver bundle; without it there is no IOAudio2 device,
          so the volume slider has nothing to talk to. This is the route the official GPU plugin uses (docs/zh/drivers/adreno740.md:36,
          docs/zh/porting/gpu.md:95-99): the staged seed is the file passed to `unixnu build payload --data-ramdisk`, so the plug-in
          travels inside the payload and no boot image and no loader build is involved. The alternative official carrier, the addon blob
          (scripts/make-gpu-addon.py, Payloads/kernel.macho.gpuaddon), needs a loader that publishes it to the kernel, which is why it is
          not used here. BASE is not modified and the volume UUID is unchanged, so no kernel rebuild follows. Nothing is written to Git
          or to the OS inputs.

          The device repository carries no DarwinBoot submodule, so the unpacker and packer are core's: point UNIXNU_CORE at the core
          checkout (it is the tree that ships drivers/DarwinBoot/Test/packed_ramdisk.py).
          """
          import json
          import os
          import plistlib
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          core = Path(os.environ.get('UNIXNU_CORE', str(ROOT))).resolve()
          TEST = core / 'drivers/DarwinBoot/Test'
          if not (TEST / 'packed_ramdisk.py').is_file():
              sys.exit(f'No {TEST}/packed_ramdisk.py: set UNIXNU_CORE to the UniXNU core checkout')
          sys.path.insert(0, str(TEST))
          import packed_ramdisk

          BUNDLE = ROOT / 'build/sheng-audio-hal/ShengAudio.driver'
          EXECUTABLE = 'ShengAudio'


          def main():
              if len(sys.argv) != 3:
                  sys.exit(__doc__)
              base, output = Path(sys.argv[1]).resolve(), Path(sys.argv[2]).resolve()
              if output.exists():
                  sys.exit('Refuse to overwrite ' + str(output))
              if not (BUNDLE / EXECUTABLE).is_file():
                  sys.exit('Build the plug-in first: python3 scripts/build-sheng-audio-hal.py build/sheng-audio-hal')
              blob = base.read_bytes()
              logical, extents = packed_ramdisk.regions(blob)
              with tempfile.TemporaryDirectory(prefix='data-seed-', dir=str(ROOT / 'build')) as td:
                  raw = Path(td) / 'seed.raw'
                  with raw.open('wb') as f:
                      f.truncate(logical)
                      for offset, data in extents:
                          f.seek(offset)
                          f.write(data)
                  mount = Path(td) / 'mount'
                  mount.mkdir()
                  attached = plistlib.loads(subprocess.check_output(
                      ['hdiutil', 'attach', '-imagekey', 'diskimage-class=CRawDiskImage', '-nobrowse', '-owners', 'off',
                       '-mountpoint', str(mount), '-plist', str(raw)]))
                  device = attached['system-entities'][0]['dev-entry']
                  try:
                      if not (mount / 'mobile').is_dir():
                          sys.exit('The Data seed has no /mobile; wrong base image?')
                      target = mount / 'ngpu/audio/ShengAudio.driver'
                      if target.exists():
                          shutil.rmtree(target)
                      target.parent.mkdir(parents=True)
                      for directory in (mount / 'ngpu', mount / 'ngpu/audio'):
                          os.chmod(directory, 0o755)
                      shutil.copytree(BUNDLE, target, symlinks=False)
                      for path in [target, *target.rglob('*')]:
                          os.chmod(path, 0o755 if path.is_dir() or path.name == EXECUTABLE else 0o644)
                      print('staged', target.relative_to(mount), sorted(p.name for p in target.iterdir()))
                  finally:
                      subprocess.run(['hdiutil', 'detach', device], check=True)
                  # The four magic bytes, read at their offset: core reads them as raw.read_bytes()[32:36], which materialises the whole
                  # expanded container and got the runner killed (exit 137) on the grown seed. Same assertion, no allocation.
                  with raw.open('rb') as probe:
                      probe.seek(32)
                      magic = probe.read(4)
                  if magic != b'NXSB':
                      sys.exit('The edited image is no APFS container any more')
                  metadata = packed_ramdisk.pack(raw, output)
              report = dict(base_sha256=packed_ramdisk.inspect(base)[0]['sha256'], output=metadata,
                            plugin=json.loads((BUNDLE.parent / 'trust.json').read_text()))
              output.with_suffix('.json').write_text(json.dumps(report, indent=2) + '\n')
              print(json.dumps(report, indent=2))


          if __name__ == '__main__':
              main()
          PY
          UNIXNU_CORE="$GITHUB_WORKSPACE" python3 "$RUNNER_TEMP/stage/add-sheng-audio-data.py" \
            "$RUNNER_TEMP/data-final.dbr" "$RUNNER_TEMP/data-audio.dbr"
          stat -f '%z %N' "$RUNNER_TEMP/data-audio.dbr"
          cat "$RUNNER_TEMP/data-audio.json"

      - name: Build the MediaCapture plug-in
        if: inputs.camera_plugin
        run: |
          # One Mach-O out of two plug-ins, because the mother board's record says a torch-only bundle cannot work: the
          # vendor class BWFigCaptureDeviceVendor is nil on a device (its init bails at 0x1a693fde0 when the default
          # create function is empty and kern.hv_vmm_present is 0), so the six methods DbyTorchPlugin.m replaces would
          # be sent to nil unless DbyCameraProvider.m's own constructor fixes that init from the same file first. The
          # builder refuses to export any CaptureDeviceCreate, so the fix adds no camera device either way.
          # arm64-apple-ios17.0 and codesign --pagesize 4096 are what the audio server plug-in uses, and the ad hoc
          # signature is why the CDHash has to join the owner trust cache instead of the file standing on its own.
          xcrun --sdk iphoneos --show-sdk-path
          python3 board/scripts/build-dby-camera-plugin.py --out "$RUNNER_TEMP/dby-camera-plugin"
          codesign --display --verbose=4 "$RUNNER_TEMP/dby-camera-plugin/H6ISP.mediacapture"
          cat "$RUNNER_TEMP/dby-camera-plugin/trust.json"
          # What the staging step copies, and nothing else.
          stat -f '%z %N' "$RUNNER_TEMP/dby-camera-plugin/H6ISP.mediacapture" "$RUNNER_TEMP/dby-camera-plugin/trust.json"

      - name: Stage the MediaCapture plug-in into the seed
        if: inputs.camera_plugin && !inputs.audio_only
        run: |
          set -euo pipefail
          # The carrier is the seed, not the addon blob: the loader flashed on this board does not publish GpuAddon, so
          # native_gpu_addon_install() returns early and only the union mounts run, and those read their source from
          # the Data volume. Staging keeps the volume UUID, so over data-final.dbr or data-audio.dbr this seed costs no
          # kernel rebuild, and BASE is not modified. Unlike the audio step this runs the script from the checkout: the
          # inlining there exists only because this token cannot create a path in this repository, while the board
          # scripts are already committed in the board repository, so nothing here is duplicated and --plugin points at
          # the built bundle instead of the script's own build/ directory (the trap run #16 of 2026-11-08 died on).
          # The base is the audio seed whenever this run built one: the board that works today ships
          # /private/var/ngpu/audio/ShengAudio.driver inside its seed, and a camera seed grown from data-final.dbr
          # instead would hand back a payload with no audio plug-in and take the speaker down with it. The recorded
          # base_sha256 in data-camera.json is what makes that chain evidence rather than a claim.
          base="$RUNNER_TEMP/data-final.dbr"
          if [ '${{ inputs.audio_hal }}' = true ] && [ -f "$RUNNER_TEMP/data-audio.dbr" ]; then
            base="$RUNNER_TEMP/data-audio.dbr"
          fi
          stat -f '%z %N' "$base"
          UNIXNU_CORE="$GITHUB_WORKSPACE" python3 board/scripts/add-dby-camera-data.py \
            ${{ inputs.camera_test_pattern && '--test-pattern' || '' }} \
            --plugin "$RUNNER_TEMP/dby-camera-plugin" "$base" "$RUNNER_TEMP/data-camera.dbr"
          stat -f '%z %N' "$RUNNER_TEMP/data-camera.dbr"
          cat "$RUNNER_TEMP/data-camera.json"

      - name: Check out the pinned Mesa source
        if: inputs.gpu_plugin
        run: |
          set -euo pipefail
          # scripts/build-turnip-darwin.py opens .cache/mesa-work and refuses to run unless its HEAD is the commit
          # pinned in scripts/data/adreno-compiler-inputs.json. No script in this repository creates that checkout:
          # docs/zh/porting/migration.md lists it as a local build input the operator supplies, so it is fetched here.
          python3 - "$GITHUB_WORKSPACE" <<'PY' >"$RUNNER_TEMP/mesa-pin.env"
          import json
          import pathlib
          import shlex
          import sys

          pins = json.loads((pathlib.Path(sys.argv[1]) / 'scripts/data/adreno-compiler-inputs.json').read_text())['mesa']
          print('MESA_COMMIT=' + shlex.quote(pins['commit']))
          print('MESA_MIRROR=' + shlex.quote(pins['mirror']))
          PY
          . "$RUNNER_TEMP/mesa-pin.env"
          work="$GITHUB_WORKSPACE/.cache/mesa-work"
          git clone --filter=blob:none --no-checkout --depth 1 "$MESA_MIRROR" "$work"
          # The whole tree, not the pin's sparse_directories list: meson walks subdir() through src/meson.build and
          # every intermediate meson.build below it, and a directory-only sparse pattern leaves those out - run
          # #43008392850 configured to "Nonexistent build file 'src/meson.build'". No script in this repository
          # reads that list, so it is not a build input; a blob-filtered single-commit clone is cheap enough whole.
          git -C "$work" fetch --depth 1 origin "$MESA_COMMIT"
          git -C "$work" checkout --detach "$MESA_COMMIT"
          # The build compares this against the pin itself, so print what it will see instead of trusting the above.
          git -C "$work" rev-parse HEAD
          test "$(git -C "$work" rev-parse HEAD)" = "$MESA_COMMIT"
          # tu_knl_darwin.cc includes NativeAdrenoABI.h and build-turnip-darwin.py points the include search at
          # drivers/NativeAdreno, while the driver submodule is drivers/Adreno740 (the .gitmodules entry and the
          # only Adreno driver directory in either tree): run #43011619527 died on "'NativeAdrenoABI.h' file not
          # found" against an empty drivers/Adreno740. Submodules are initialised the way the seed steps
          # initialise drivers/DarwinBoot, and the two directories the build steps still name by their old names
          # point at the real ones - build-adreno-metal-plugin.py also reads NativeAdrenoMetalPlugin.mm and
          # NativeAdrenoProbeDaemon.cpp from drivers/NativeMetal - rather than the upstream scripts being edited.
          git submodule update --init --depth 1 drivers/Adreno740 drivers/AdrenoMetal kits/AdrenoPM4 kits/ArmSmmu4K
          test -f drivers/Adreno740/NativeAdrenoABI.h
          test -f drivers/AdrenoMetal/NativeAdrenoMetalPlugin.mm
          test -f kits/ArmSmmu4K/ArmSmmu4KContext.c
          ln -sfn Adreno740 drivers/NativeAdreno
          ln -sfn AdrenoMetal drivers/NativeMetal
          # scripts/mesa_patch_identity.py reverse-applies the recorded patches to prove the tree carries exactly
          # them, and rejects any change the pin does not name. They are applied here in the pin's order.
          python3 - "$GITHUB_WORKSPACE" "$work" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root, work = pathlib.Path(sys.argv[1]), sys.argv[2]
          pins = json.loads((root / 'scripts/data/adreno-compiler-inputs.json').read_text())
          for patch in pins['patches']:
              subprocess.run(['git', '-C', work, 'apply', '--whitespace=nowarn', str(root / patch)], check=True)
              print('applied', patch)
          PY
          git -C "$work" diff --stat HEAD | tail -5

      - name: Install the toolchain the GPU builders name
        if: inputs.gpu_plugin
        run: |
          # Three products, in the order the builders demand them: Turnip (Mesa's Adreno Vulkan driver compiled for
          # Darwin arm64), the Rust bridge archive, then the plug-in bundle. scripts/build-adreno-metal-plugin.py
          # refuses to start without build/mesa-tu-ios/src/freedreno/vulkan/libvulkan_freedreno.dylib, which is the
          # first command's output, and it links the archive the second one produces.
          # build-turnip-darwin.py runs .cache/mesa-venv/bin/meson and puts .cache/mesa-tools/bin ahead of PATH, and
          # it stops on a missing glslangValidator. Neither directory is created by any script in this repository,
          # so the toolchain the build names is installed here before it runs.
          brew list glslang >/dev/null 2>&1 || brew install glslang
          brew list ninja >/dev/null 2>&1 || brew install ninja
          # gen-turnip-smoke-shaders.py, called by build-adreno-metal-plugin.py, compiles the smoke shaders with
          # glslc (shaderc), which is a separate formula from glslang.
          brew list shaderc >/dev/null 2>&1 || brew install shaderc
          # build-adreno-metal-bridge.py assembles its fixture with llvm-as (LLVM 21 or newer, looked up at
          # /opt/homebrew/opt/llvm/bin first) and runs cargo +1.98.0.
          brew list llvm >/dev/null 2>&1 || brew install llvm
          if ! rustup toolchain list | grep -q '^1\.98\.0'; then rustup toolchain install 1.98.0; fi
          # The bridge is built for arm64-apple-ios17.0, and rustc needs that target's core installed for the
          # pinned toolchain or every crate fails with "can't find crate for core".
          rustup target add aarch64-apple-ios --toolchain 1.98.0
          /opt/homebrew/opt/llvm/bin/llvm-as --version | head -2
          cargo +1.98.0 --version
          glslc --version | head -2
          python3 -m venv .cache/mesa-venv
          .cache/mesa-venv/bin/pip install --quiet --upgrade pip
          .cache/mesa-venv/bin/pip install --quiet 'meson>=1.3' mako pyyaml packaging
          mkdir -p .cache/mesa-tools/bin
          ln -sf "$(command -v ninja)" .cache/mesa-tools/bin/ninja
          # ir3_parser.c is generated by bison, and the pin records one exact bison (3.8.2) with its own sha256
          # rather than taking whatever the runner ships: run #43009159759 configured cleanly and then failed the
          # first generated file. It is built from the pinned tarball into .cache/mesa-tools/bin, which
          # build-turnip-darwin.py puts ahead of PATH.
          python3 - "$GITHUB_WORKSPACE" <<'PY' >"$RUNNER_TEMP/bison-pin.env"
          import json
          import pathlib
          import shlex
          import sys

          pins = json.loads((pathlib.Path(sys.argv[1]) / 'scripts/data/adreno-compiler-inputs.json').read_text())['bison']
          for name in ('version', 'url', 'sha256'):
              print('BISON_' + name.upper() + '=' + shlex.quote(pins[name]))
          PY
          . "$RUNNER_TEMP/bison-pin.env"
          curl -fsSL --retry 3 "$BISON_URL" -o "$RUNNER_TEMP/bison.tar.xz"
          echo "$BISON_SHA256  $RUNNER_TEMP/bison.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/bison.tar.xz" -C "$RUNNER_TEMP"
          (
            cd "$RUNNER_TEMP/bison-$BISON_VERSION"
            ./configure --prefix="$GITHUB_WORKSPACE/.cache/mesa-tools" --disable-nls >/dev/null
            make -j4 >/dev/null
            make install >/dev/null
          )
          .cache/mesa-tools/bin/bison --version | head -1
          .cache/mesa-venv/bin/meson --version
          glslangValidator --version | head -2

      - name: Check out the pinned metal2vulkan translator and build the plug-in
        if: inputs.gpu_plugin
        run: |
          set -euo pipefail
          # build-adreno-metal-bridge.py opens .cache/gpu-reference/metal2vulkan and compares its HEAD with the
          # commit in scripts/data/gpu-metal-vulkan-inputs.json, exactly as build-turnip-darwin.py does for Mesa.
          # Like the Mesa checkout, no script here creates it: run #43014610596 built Turnip, then stopped at
          # "cannot change to .../.cache/gpu-reference/metal2vulkan".
          python3 - "$GITHUB_WORKSPACE" <<'PY' >"$RUNNER_TEMP/translator-pin.env"
          import json
          import pathlib
          import shlex
          import sys

          pins = json.loads((pathlib.Path(sys.argv[1]) / 'scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']
          print('TRANSLATOR_COMMIT=' + shlex.quote(pins['commit']))
          print('TRANSLATOR_REPO=' + shlex.quote(pins['repository']))
          PY
          . "$RUNNER_TEMP/translator-pin.env"
          work="$GITHUB_WORKSPACE/.cache/gpu-reference/metal2vulkan"
          mkdir -p "$(dirname "$work")"
          git clone --filter=blob:none --no-checkout "$TRANSLATOR_REPO" "$work"
          git -C "$work" fetch --depth 1 origin "$TRANSLATOR_COMMIT"
          git -C "$work" checkout --detach "$TRANSLATOR_COMMIT"
          git -C "$work" rev-parse HEAD
          test "$(git -C "$work" rev-parse HEAD)" = "$TRANSLATOR_COMMIT"
          # The target is ios (arm64-apple-ios17.0): the same architecture the audio and MediaCapture plug-ins use,
          # so one owner trust cache can name all three CDHashes.
          python3 scripts/build-turnip-darwin.py --target ios
          # gen-turnip-replay.py, called from the plug-in build, runs check-turnip-darwin-host.py, which refuses
          # without a host build of the same source: "Build the host Turnip first".
          python3 scripts/build-turnip-darwin.py --target host
          # check-turnip-darwin-host.py compiles driver sources that include <sys/resource_private.h> for the
          # PRIO_DARWIN_GPU_* roles, and that header is a kernel-private one the macOS SDK does not ship. The
          # script already stubs the IOKit headers it needs under build/turnip-darwin-host/host-include; the two
          # constants this code uses are given the same treatment rather than pulling XNU's private header chain.
          mkdir -p build/turnip-darwin-host/host-include/sys
          python3 - <<'PY'
          import pathlib

          pathlib.Path('build/turnip-darwin-host/host-include/sys/resource_private.h').write_text(
              '#ifndef _SYS_RESOURCE_PRIVATE_H_\n'
              '#define _SYS_RESOURCE_PRIVATE_H_\n'
              '/* Values from xnu bsd/sys/resource_private.h; only the GPU roles are named here. */\n'
              '#define PRIO_DARWIN_GPU               5\n'
              '#define PRIO_DARWIN_GPU_UNKNOWN       0x0\n'
              '#define PRIO_DARWIN_GPU_ALLOW         0x1\n'
              '#define PRIO_DARWIN_GPU_DENY          0x2\n'
              '#define PRIO_DARWIN_GPU_BACKGROUND    0x3\n'
              '#define PRIO_DARWIN_GPU_UTILITY       0x4\n'
              '#define PRIO_DARWIN_GPU_UI_NON_FOCAL  0x5\n'
              '#define PRIO_DARWIN_GPU_UI            0x6\n'
              '#define PRIO_DARWIN_GPU_UI_FOCAL      0x7\n'
              '#endif\n')
          PY
          python3 scripts/build-adreno-metal-bridge.py
          python3 scripts/build-adreno-metal-plugin.py --target ios
          ls -l build/adreno-metal-plugin/ | tail -30
          stat -f '%z %N' build/adreno-metal-plugin/NativeAdrenoMetal.bundle/NativeAdrenoMetal \
            build/adreno-metal-plugin/NativeAdrenoMetal.bundle/libvulkan_freedreno.dylib \
            build/adreno-metal-plugin/NativeAdrenoMetal.bundle/Info.plist
          cat build/adreno-metal-plugin/trust.json

      - name: Stage the Adreno Metal plug-in into the seed
        if: inputs.gpu_plugin && !inputs.audio_only
        run: |
          set -euo pipefail
          # core's own scripts/add-gpu-plugin-data.py, run from the checkout: this step only adds files under
          # /private/var/ngpu/addons, so it needs none of the mount-format knowledge the audio script had to inline.
          # The chains are the ones the camera step uses, so a run with gpu_plugin on top of audio_hal and
          # camera_plugin produces one seed that carries all three plug-ins and the kernel's mounts 0x400, 0xa00 and
          # 0xe00 all find their source.
          base="$RUNNER_TEMP/data-final.dbr"
          if [ '${{ inputs.audio_hal }}' = true ] && [ -f "$RUNNER_TEMP/data-audio.dbr" ]; then
            base="$RUNNER_TEMP/data-audio.dbr"
          fi
          if [ '${{ inputs.camera_plugin }}' = true ] && [ -f "$RUNNER_TEMP/data-camera.dbr" ]; then
            base="$RUNNER_TEMP/data-camera.dbr"
          fi
          stat -f '%z %N' "$base"
          args=()
          if [ '${{ inputs.gpu_publish }}' = true ]; then args+=(--publish); fi
          if [ -n '${{ inputs.gpu_clients }}' ]; then args+=(--clients '${{ inputs.gpu_clients }}'); fi
          python3 scripts/add-gpu-plugin-data.py "${args[@]}" "$base" "$RUNNER_TEMP/data-gpu.dbr"
          stat -f '%z %N' "$RUNNER_TEMP/data-gpu.dbr"
          cat "$RUNNER_TEMP/data-gpu.json"

      - name: Report the seeds
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/data-*.dbr; do
            [ -f "$f" ] || continue
            printf '%s %s %s\n' "$(basename "$f")" "$(stat -f %z "$f")" "$(shasum -a 256 "$f" | cut -d' ' -f1)"
          done
          stat -f '%N %z' build/owner-data-fixture/owner-data-32.cdr 2>/dev/null || echo 'no fresh fixture: this run grew the base seed'
          shasum -a 256 build/owner-data-fixture/owner-data-32.cdr 2>/dev/null || true

      - name: Upload the Data seed
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unixnu-dby-w09-data-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/owner-data-fixture/seed.json
            build/owner-data-fixture/owner-data-32.cdr
            ${{ runner.temp }}/data-32.dbr
            ${{ runner.temp }}/data-qemu.dbr
            ${{ runner.temp }}/data-grow.dbr
            ${{ runner.temp }}/data-final.dbr
            ${{ runner.temp }}/data-final.json
            ${{ runner.temp }}/data-audio.dbr
            ${{ runner.temp }}/data-audio.json
            ${{ runner.temp }}/data-camera.dbr
            ${{ runner.temp }}/data-camera.json
            ${{ runner.temp }}/data-gpu.dbr
            ${{ runner.temp }}/data-gpu.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the audio server plug-in
        if: inputs.audio_hal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unixnu-sheng-audio-hal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sheng-audio-hal/ShengAudio.driver/Info.plist
            ${{ runner.temp }}/sheng-audio-hal/ShengAudio.driver/ShengAudio
            ${{ runner.temp }}/sheng-audio-hal/trust.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload the MediaCapture plug-in
        if: inputs.camera_plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unixnu-dby-camera-plugin-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dby-camera-plugin/H6ISP.mediacapture
            ${{ runner.temp }}/dby-camera-plugin/trust.json
          if-no-files-found: error
          retention-days: 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Data seed for dby_w09"
            echo
            echo '| File | Meaning |'
            echo '| --- | --- |'
            echo '| owner-data-32.cdr | dense 32 MiB raw APFS container (the fixture as Apple-sized) |'
            echo '| data-32.dbr | the same container as DBRDISK1 |'
            echo '| data-qemu.dbr | grown to qemu_seed_mib for the QEMU fixture: NativeRamBlock writes only seeds up to 2 GiB without a UFS store, 32 MiB exhausts itself in two minutes, and its attach-time hash costs one SHA256_Update per 4 KiB of logical size |'
            echo '| data-grow.dbr | grown to the userdata partition |'
            echo '| data-final.dbr | grown and Setup marked done; this is the seed the board ships |'
            echo '| data-audio.dbr | data-final.dbr plus /private/var/ngpu/audio/ShengAudio.driver; this is the seed the board ships when audio_hal is on |'
          echo '| data-camera.dbr | data-audio.dbr (or data-final.dbr with audio_hal off) plus /private/var/ngpu/mediacapture/H6ISP.mediacapture and the DbyCameraTestPattern marker; this is the seed the board ships when camera_plugin is on |'
            echo '| sheng-audio-hal/ShengAudio.driver | the compiled CoreAudio server plug-in, in its own artifact unixnu-sheng-audio-hal-RUN-ATTEMPT |'
            echo
            echo 'A grown seed is only deliverable packed: [payload.adt] packed_data_ramdisk = true makes the ADT'
            echo 'reserve PackedRAMDisk, DarwinBoot keeps the DBRDISK1 bytes (KeepPacked) and the kernel'
            echo '(CONFIG_XNU_NATIVE_RAM_BLOCK=y) serves the sparse container, which is the official sheng layout'
            echo '(docs/devices/sheng.md:222). The dense 32 MiB fixture was expandable by the firmware; a 95 GiB'
            echo 'container is not, so packed_data_ramdisk = false is only ever a small-seed workaround.'
            echo
            echo '`build/owner-data-fixture/seed.json` carries the volume UUID the kernel needs in'
            echo 'CONFIG_XNU_OWNER_DATA_VOLUME_UUID (build-xnu-4k-baseline.sh:499-524 writes it into'
            echo 'build/xnu/owner-data-volume.h, and kern_exec.c:7993 looks the seed up by exactly that string:'
            echo 'a seed whose UUID differs makes the board panic `offline scratch Data mount failed: 2`).'
            echo
            echo 'So a fresh fixture always costs a kernel rebuild, while a seed grown from a recorded base keeps'
            echo 'its UUID (docs/guide/userdata.md) and can ship as a payload-only change. When base_seed names a'
            echo 'run, no new fixture is formatted and this run inherits that run'"'"'s UUID.'
            echo 'Artifact retention is 1 day. No Apple image is uploaded, only the seed.'

            echo
            echo 'With audio_hal the plug-in'"'"'s CDHash is in `sheng-audio-hal/trust.json` and is a build output, not a'
            echo 'recorded constant: an untrusted bundle is refused by AMFI before the audio server loads it. The Linux'
            echo 'half packs it the way the upstream does it for its own board (UniXNU-sheng scripts/pack27-gpu.sh:16,19):'
            echo '`addon-add-dir.py BASE.bin ADDON.bin audio <stage>` puts the bundle in the NGPUADD2 addon under'
            echo '`audio/`, and `trust-append-module.py` appends its CDHash to the owner trust bundle, which'
            echo '`unixnu build payload --gpu-addon ADDON.bin --owner-trust-cache BUNDLE` then ships. The kernel mounts'
            echo 'the addon'"'"'s audio directory over /System/Library/Audio/Plug-Ins/HAL (kern_exec.c:7646, the 0xa00'
            echo 'entry, gated by the boot arg sheng-gpu-addon=1) and reports on the BootProgress A line as'
            echo '`mount4=stage/status`. With audio_only no seed is produced, which is deliberate:'
            echo 'docs/porting/packaging.md:136-137 states that GPU and audio updates travel in the addon and do not'
            echo 'edit the Data seed, so the board'"'"'s existing seed keeps its volume UUID and no kernel rebuild.'
            echo
            echo 'With camera_plugin the same holds for `dby-camera-plugin/trust.json`: the CDHash of the exact bytes that'
            echo 'were compiled is what `scripts/add-dby-camera-trust.py` puts into the owner trust bundle, because'
            echo 'mediaserverd is a platform process and AMFI refuses to map an ad hoc bundle that no trusted cache names.'
            echo 'The plug-in artifact and data-camera.dbr of one run are therefore a pair: rebuild the plug-in, and the'
            echo 'pair has to be re-made, with the predecessor'"'"'s hash dropped from the owner module.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove proprietary inputs
        if: always()
        run: |
          # Mirrors the cleanup step of the official macOS build workflow.
          hdiutil detach "$PWD/.cache/firmware/target-volumes/os-mount" -force || true
          rm -rf out/ipsw .cache/firmware device/.cache/firmware build/owner-data-fixture
          rm -f "$RUNNER_TEMP"/data-32.dbr "$RUNNER_TEMP"/data-qemu.dbr "$RUNNER_TEMP"/data-grow.dbr "$RUNNER_TEMP"/data-final.dbr
          rm -f "$RUNNER_TEMP"/data-camera.dbr "$RUNNER_TEMP"/data-camera.json
          rm -rf "$RUNNER_TEMP"/sheng-audio-hal kit
          rm -rf "$RUNNER_TEMP"/dby-camera-plugin board
          rm -rf "$RUNNER_TEMP"/grow-qemu
